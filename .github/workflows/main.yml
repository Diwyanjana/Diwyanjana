name: Generate Snake

on:
  # සෑම දිනකම මධ්‍යම රාත්‍රියේදී මෙය ක්‍රියාත්මක වේ
  schedule:
    - cron: "0 0 * * *" 
  
  # ඕනෑම වෙලාවක manual run කරන්න පුළුවන් වෙන්න
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Generate the snake files in './dist/'
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # වැදගත්: මේක වැඩ කරන්න නම් ඔයාගේ repo එකේ Settings -> Actions -> General ගිහින්
          # "Workflow permissions" යටතේ "Read and write permissions" enable කරන්න ඕනේ.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update snake animations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
